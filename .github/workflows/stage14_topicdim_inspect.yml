name: OpenAlex Stage 14 Topic Dimension Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/openalex_stage14_topicdim_start'

permissions:
  contents: read

env:
  SOURCE_TAG: openalex-stage8-11-2026-09-23

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DuckDB
        run: python -m pip install --quiet duckdb==1.5.5 pytz
      - name: Download entity layer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$SOURCE_TAG" --pattern "stage8_11_entity_layer.zip" --dir .
          unzip -l stage8_11_entity_layer.zip | tee entity_listing.txt
          mkdir entity
          unzip -q stage8_11_entity_layer.zip -d entity
          find entity -type f | sort
      - name: Inspect topic-like parquet files
        run: |
          python - <<'PY'
          import duckdb,glob,json,os
          con=duckdb.connect()
          out={}
          for p in glob.glob("entity/entities/topics/dimension_parts/*.parquet"):

              try:
                  schema=[{"name":r[0],"type":r[1]} for r in con.execute(f"DESCRIBE SELECT * FROM read_parquet('{p}')").fetchall()]
                  cur=con.execute(f"SELECT * FROM read_parquet('{p}') LIMIT 3")
                  cols=[d[0] for d in cur.description]
                  sample=[dict(zip(cols,r)) for r in cur.fetchall()]
                  out[p]={"schema":schema,"sample":sample,"rows":con.execute(f"SELECT count(*) FROM read_parquet('{p}')").fetchone()[0]}
              except Exception as e:
                  out[p]={"error":str(e)}
          open("STAGE14_TOPICDIM_SCHEMA.json","w").write(json.dumps(out,indent=2,default=str))
          print(json.dumps(out,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: STAGE14_TOPICDIM_SCHEMA
          path: |
            STAGE14_TOPICDIM_SCHEMA.json
            entity_listing.txt
          retention-days: 14
