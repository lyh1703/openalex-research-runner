name: OpenAlex Stage 16

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/openalex_stage16_start'

permissions:
  contents: write

concurrency:
  group: openalex-stage16
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  TAG15: openalex-stage15-2026-09-23
  RESULT_TAG: openalex-stage16-2026-09-23

jobs:
  stage16:
    name: Stage 16 historical backtesting
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: python -m pip install --quiet duckdb==1.5.5

      - name: Download Stage 15 frozen features
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p raw inputs
          gh release download "$TAG15" --pattern "stage15_outputs.zip" --dir raw
          sha256sum raw/stage15_outputs.zip | tee STAGE16_INPUT_SHA256.txt
          unzip -q raw/stage15_outputs.zip \
            STAGE15_FINAL_GATE.json \
            topic_early_signal_features.parquet \
            keyword_early_signal_features.parquet \
            -d inputs
          ls -lh inputs

      - name: Run Stage 16 backtests
        run: |
          python scripts/stage16_backtest.py \
            --input inputs \
            --output stage16

      - name: Persist provenance
        run: cp STAGE16_INPUT_SHA256.txt stage16/

      - name: Package Stage 16 outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets split_assets
          cp STAGE16_BACKTEST_CONTRACT.md release_assets/
          cp stage16/STAGE16_FINAL_GATE.json release_assets/
          cp stage16/STAGE16_VALIDATION.json release_assets/
          cp stage16/STAGE16_TARGET_DIAGNOSTICS.json release_assets/
          cp stage16/STAGE16_INPUT_SHA256.txt release_assets/
          cp stage16/OPENALEX_STAGE16_BACKTEST_REPORT.md release_assets/
          (cd stage16 && zip -qr ../release_assets/stage16_outputs.zip .)
          for f in release_assets/*; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1900000000 ]; then
              cp "$f" split_assets/
            else
              split -b 1800M -d -a 2 "$f" "split_assets/$(basename "$f").part-"
            fi
          done
          ls -lh split_assets

      - name: Publish persistent Stage 16 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RESULT_TAG" --yes --cleanup-tag || true
          gh release create "$RESULT_TAG" split_assets/* \
            --title "OpenAlex Stage 16 | 2026-09-23 frozen snapshot" \
            --notes "Retrospective historical backtesting of Stage 15 early-signal features against 3y/5y future share growth, cross-domain convergence gain, and 3y realized cohort citation impact. No production score/model weights selected."

      - name: Upload compact Stage 16 gates
        uses: actions/upload-artifact@v4
        with:
          name: OPENALEX_STAGE16_FINAL_GATES
          path: |
            STAGE16_BACKTEST_CONTRACT.md
            stage16/STAGE16_FINAL_GATE.json
            stage16/STAGE16_VALIDATION.json
            stage16/STAGE16_TARGET_DIAGNOSTICS.json
            stage16/STAGE16_INPUT_SHA256.txt
            stage16/OPENALEX_STAGE16_BACKTEST_REPORT.md
          retention-days: 30
